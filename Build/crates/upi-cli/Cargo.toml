[package]
name = "upi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "upi"
path = "src/main.rs"

[dependencies]
upi-core = { path = "../upi-core" }
upi-net = { path = "../upi-net" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.4"
log = "0.4"
env_logger = "0.11.10"
